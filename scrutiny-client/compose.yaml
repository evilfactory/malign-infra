services:
  scrutiny-collector:
    image: ghcr.io/analogj/scrutiny:latest-collector
    container_name: scrutiny-collector
    restart: unless-stopped

    privileged: true
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN

    volumes:
      - /run/udev:/run/udev:ro
      - /dev:/dev

    environment:
      COLLECTOR_API_ENDPOINT: ${SCRUTINY_API_ENDPOINT}
      COLLECTOR_HOST_ID: ${SCRUTINY_HOST_ID}