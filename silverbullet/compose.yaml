services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
    networks:
      - http-proxy
    labels:
      caddy: "${DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  http-proxy:
    external: true