services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped

    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${LIVEKIT_LOG_LEVEL}

        rtc:
          tcp_port: 7881
          udp_port: 7882
          stun_servers:
            - stun.l.google.com:19302
            - stun1.l.google.com:19302

        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

        webhook:
          api_key: ${LIVEKIT_WEBHOOK_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL}

    ports:
      - "${LIVEKIT_HTTP_PORT}:7880"
      - "${LIVEKIT_RTC_TCP_PORT}:7881"
      - "${LIVEKIT_RTC_UDP_PORT}:7882/udp"