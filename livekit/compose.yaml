services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped

    labels:
      caddy: "${LIVEKIT_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 7880}}"

    environment:
      NODE_IP: ${LIVEKIT_NODE_IP}
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${LIVEKIT_LOG_LEVEL}

        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT}
          udp_port: ${LIVEKIT_RTC_UDP_PORT}
          stun_servers:
            - stun.l.google.com:19302
            - stun1.l.google.com:19302

        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

        webhook:
          api_key: ${LIVEKIT_WEBHOOK_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL}

    networks:
      - default
      - http-proxy

    ports:
      - "${LIVEKIT_RTC_TCP_PORT}:${LIVEKIT_RTC_TCP_PORT}"
      - "${LIVEKIT_RTC_UDP_PORT}:${LIVEKIT_RTC_UDP_PORT}/udp"

networks:
  http-proxy:
    external: true